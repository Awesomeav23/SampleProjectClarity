name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, build, smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clarity_user
          POSTGRES_PASSWORD: clarity_local_pass
          POSTGRES_DB: project_clarity
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U clarity_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run --passWithNoTests
      - name: Run migrations + seed
        env:
          DATABASE_URL: postgresql://clarity_user:clarity_local_pass@localhost:5434/project_clarity
        run: |
          npm run migrate
          npm run seed
      - name: Start backend and smoke test
        env:
          MOCK_MODE: 'true'
          DATABASE_URL: postgresql://clarity_user:clarity_local_pass@localhost:5434/project_clarity
          REDIS_HOST: localhost
          REDIS_PORT: '6380'
          JWT_SECRET: ci-smoke-secret
        run: |
          npm start &
          SERVER_PID=$!
          echo "backend started (pid=$SERVER_PID)"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          npm run smoke
          SMOKE_EXIT=$?
          kill $SERVER_PID || true
          exit $SMOKE_EXIT

  frontend:
    name: Frontend — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
